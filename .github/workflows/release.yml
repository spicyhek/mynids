name: Build Push and Update Infra

on:
  push:
    branches:
      - main

concurrency:
  group: mynids-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out app repository
        uses: actions/checkout@v4

      - name: Set up Python for regression tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run regression tests before publishing
        run: |
          python -m pip install -r requirements-test.txt
          python -m unittest discover -s tests -v
          node --test tests/dashboard.test.cjs

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/spicyhek/mynids" >> "$GITHUB_ENV"

      - name: Set image tag
        run: echo "IMAGE_TAG=sha-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          platforms: linux/amd64,linux/arm64

      - name: Check out infra repository
        uses: actions/checkout@v4
        with:
          repository: spicyhek/homelab-infra
          ref: main
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: homelab-infra

      - name: Update image tag in kustomization
        working-directory: homelab-infra
        run: |
          sed -i "s|newTag: .*|newTag: ${IMAGE_TAG}|" k8s/apps/nids/kustomization.yml

      - name: Commit and merge infra pull request
        working-directory: homelab-infra
        env:
          GH_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
        run: |
          set -euo pipefail

          LATEST_SHA="$(git -C "${GITHUB_WORKSPACE}" ls-remote origin refs/heads/main | cut -f1)"
          if [ -z "${LATEST_SHA}" ]; then
            echo "::error::Could not determine the current mynids main commit"
            exit 1
          fi
          if [ "${LATEST_SHA}" != "${GITHUB_SHA}" ]; then
            echo "Skipping superseded release ${GITHUB_SHA}; main is now ${LATEST_SHA}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          DEPLOY_BRANCH="deploy/mynids-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "${DEPLOY_BRANCH}"

          git add k8s/apps/nids/kustomization.yml

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Deploy mynids ${IMAGE_TAG}"
          git push --set-upstream origin "${DEPLOY_BRANCH}"

          DEPLOY_COMMIT="$(git rev-parse HEAD)"
          PR_URL="$(gh pr create \
            --repo spicyhek/homelab-infra \
            --base main \
            --head "${DEPLOY_BRANCH}" \
            --title "Deploy mynids ${IMAGE_TAG}" \
            --body "Promotes mynids image \`${IMAGE_TAG}\`. Generated by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}.")"

          gh pr merge "${PR_URL}" \
            --repo spicyhek/homelab-infra \
            --squash \
            --match-head-commit "${DEPLOY_COMMIT}"

          {
            echo "### mynids image promoted"
            echo "Image: \`${IMAGE_NAME}:${IMAGE_TAG}\`"
            echo "Merged infrastructure PR: ${PR_URL}"
            echo "Argo CD watches homelab-infra/main and will reconcile the new image."
          } >> "${GITHUB_STEP_SUMMARY}"
